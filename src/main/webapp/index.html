<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sunrise Dental - Login</title>
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%); }
        h2 { font-family: 'Montserrat', sans-serif; color: #1e3a8a; margin-bottom: 25px; font-size: 24px; }

        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 350px; text-align: center; animation: fadeSlideUp 0.6s ease-out forwards; }

        input { width: 100%; padding: 12px 15px; margin: 10px 0 20px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; transition: all 0.3s ease; }
        input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

        button { width: 100%; padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 16px; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(30, 58, 138, 0.2); }
        button:hover { background: #1e40af; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(30, 58, 138, 0.3); }

        .error { color: #ef4444; font-size: 14px; display: none; margin-top: 15px; background: #fee2e2; padding: 10px; border-radius: 6px; }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Sunrise Dental</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Secure Login</button>
    </form>
    <p class="error" id="errorMsg">Invalid username or password.</p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            if (response.ok) {
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            console.error("Connection error:", error);
        }
    });
</script>
</body>
</html>
